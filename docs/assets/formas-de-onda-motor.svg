<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Formas de onda ideais no pino PUL</title>
<desc id="desc">Comparação dos perfis lenta, normal e rápida. Um passo corresponde a um nível alto e um nível baixo.</desc>
<rect width="1200" height="800" fill="#fff"/>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#20242b} .title{font-size:25px;font-weight:700} .subtitle{font-size:19px} .label{font-size:17px} .tick{font-size:15px;fill:#3c424b} .grid{stroke:#aeb4bc;stroke-opacity:.25;stroke-width:1} .axis{stroke:#20242b;stroke-width:1.4} .wave{fill:none;stroke-width:3;stroke-linejoin:round} .period{fill:none;stroke-width:1.5;marker-start:url(#arrow);marker-end:url(#arrow)}
</style>
<defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto"><path d="M7 0L0 3.5L7 7" fill="none" stroke="context-stroke" stroke-width="1.3"/></marker></defs>
